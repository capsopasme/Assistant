name: Build

# - every push / pull request: run the unit tests, build the APK and keep it as a workflow artifact
# - a tag v*, or "Run workflow" with a release tag (e.g. v1.0.0): also publish a GitHub release
#   with the APK; the dispatched form creates the tag itself. Requires the signing secrets.
#
# Signing secrets (Settings -> Secrets and variables -> Actions -> Repository secrets): any names.
# find-signing-key.sh recognizes the keystore by its content (base64 of a .jks / .p12) and tries
# every secret named like a password / alias against it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag, e.g. v1.0.0 (created on the selected branch's HEAD). Empty: just build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_tag }}
  # never cancel a release build
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release_tag }}

env:
  # the tag to release: a pushed v* tag, or the dispatch input
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Version
        id: version
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::Release tag must look like v1.2.3, got '$RELEASE_TAG'"
              exit 1
            fi
            existing=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" || true)
            if [ -n "$existing" ] && [ "$existing" != "$(git rev-parse HEAD)" ]; then
              echo "::error title=Version::Tag $RELEASE_TAG already exists on another commit"
              exit 1
            fi
            name="${RELEASE_TAG#v}"
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            name="${last#v}-dev.${GITHUB_RUN_NUMBER}+$(git rev-parse --short HEAD)"
          fi
          base="${name%%[-+]*}"
          IFS=. read -r major minor patch <<<"$base"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          [ "$code" -gt 0 ] || code=1
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $name ($code)"

      - name: Unit tests
        run: .github/scripts/run-logged.sh ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Signing key
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: .github/scripts/find-signing-key.sh

      - name: Build APK
        run: .github/scripts/run-logged.sh ./gradlew --no-daemon :app:assembleRelease -PappVersionName=${{ steps.version.outputs.name }} -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Check APK
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -eq 1 ] || { echo "expected one APK, got: ${apks[*]}"; exit 1; }
          apk="${apks[0]}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "--- manifest"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -E 'package=|versionName|versionCode|targetSdkVersion' || true
          echo "--- signature"
          certs=$("$BT/apksigner" verify --print-certs "$apk")
          grep -E 'Signer|SHA-256' <<<"$certs" || true
          if [ -n "$RELEASE_TAG" ] && grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error title=Signing::A release must not be signed with the debug key"
            exit 1
          fi
          mkdir -p dist
          out="dist/Assistant-${{ steps.version.outputs.name }}.apk"
          out="${out//+/_}"
          cp "$apk" "$out"
          ls -l dist
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Assistant-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            args=(--notes-file "$notes")
          else
            args=(--generate-notes)
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.apk --target "$GITHUB_SHA" --title "$RELEASE_TAG" "${args[@]}"
          fi
          gh release view "$RELEASE_TAG" --json url,assets --jq '"::notice title=Released::\(.url) \([.assets[].name] | join(", "))"'
